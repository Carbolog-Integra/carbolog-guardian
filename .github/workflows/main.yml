name: Executar Robô de Telemetria

on:
  schedule:
    - cron: '*/15 * * * *' # Executa a cada 15 minutos (ou o seu gatilho atual)
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests zeep

      - name: Executar Sincronizador SASCAR
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SASCAR_USER: ${{ secrets.SASCAR_USER }}
          SASCAR_PASS: ${{ secrets.SASCAR_PASS }}
        run: python sync_sascar.py
