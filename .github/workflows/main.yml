name: Sincronizador SASCAR - Robô

on:
  workflow_dispatch: # Permite rodar manualmente a qualquer momento pelo botão no GitHub
  schedule:
    - cron: '*/30 * * * *' # Executa automaticamente a cada 30 minutos

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          pip install requests

      - name: Executar Robô de Telemetria
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SASCAR_USER: ${{ secrets.SASCAR_USER }}
          SASCAR_PASS: ${{ secrets.SASCAR_PASS }}
        run: |
          python sync_sascar.py
